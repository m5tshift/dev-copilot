  # ----------------------------------------------------------------------- tracker

  - id: tracker_ratelimit_owner
    split: dev
    category: tracker
    question: Кто занимается проблемой с rate limiter и какое решение обсуждали?
    reference: |
      Задача #2, исполнитель carol. Варианты: перенести счётчики в Redis или в SQLite. alice
