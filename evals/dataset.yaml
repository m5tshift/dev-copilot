# Eval dataset for Dev Copilot (phase 4). Schema: src/devcopilot/evals/dataset.py.
#
# Every expectation refers to the world built by `devcopilot seed` (hashes are
# deterministic). Facts are substrings, case-insensitive; a list means "any of".
# The rubric is for the LLM judge and for human labels: each criterion is a claim
# the answer must make, not a word it must contain.
#
# Splits: tune prompts on `dev` only; run `holdout` to check the improvement is real.

tasks:

  # ------------------------------------------------------------------ cross-source

  - id: ci_root_cause
    split: dev
    category: cross
    question: Почему падает CI на main и связано ли это с жалобами в трекере?
    reference: |
      CI на main падает с прогона 104 на коммите 329311c (bob, 2026-10-15, «allow injecting
      clock»). В shortlink/expiry.py:12 вместо datetime.now(timezone.utc) теперь вызывается
      datetime.now() без часового пояса; сравнение с created_at, у которого часовой пояс
      есть, бросает TypeError: can't compare offset-naive and offset-aware datetimes. Падают
      test_fresh_link_not_expired и test_old_link_expired. Да, связано: в задаче #3 с 15
      октября ссылки с TTL отдают HTTP 500. resolve() вызывает is_expired() только для ссылок
      с TTL, и тот же TypeError даёт 500.
    rubric:
      - Называет коммит 329311c как коммит, с которого CI начал падать.
      - Объясняет причину ошибки — datetime.now() без часового пояса сравнивается с датой, у которой часовой пояс есть, отсюда TypeError.
      - "Утверждает, что жалобы из задачи #3 (HTTP 500 у ссылок с TTL) вызваны этой же ошибкой."
    facts: ["329311c", "#3", "expiry.py", [datetime.now, naive]]
    tools: [[list_ci_runs, get_ci_log], [git_show, read_file, search_code], [search_issues, get_issue]]
    max_tool_calls: 10
    route: [ci_investigator, code_analyst, tracker_analyst]

  - id: cross_alice_hypothesis
    split: dev
    category: cross
    question: Alice предполагает, что ссылки с TTL ломаются из-за нового rate limiter. Это так?
    reference: |
      Нет. Rate limiter (коммит 3d0b5bd, carol, 2026-09-20) проверяется только в shorten(),
      а не в resolve(), и после него CI был зелёным (прогон 103). Ссылки с TTL ломаются с
      деплоя 15 октября: коммит 329311c в shortlink/expiry.py заменил
      datetime.now(timezone.utc) на datetime.now() без часового пояса, и is_expired() бросает
      TypeError, который превращается в HTTP 500 (задача #3).
    rubric:
      - Говорит, что гипотеза alice неверна — rate limiter не причина.
      - Называет настоящую причину — коммит 329311c или наивный datetime.now() в expiry.py, из-за которого возникает TypeError.
    facts: ["329311c", "expiry"]
    tools: [[get_issue, search_issues], [git_show, read_file, search_code, get_ci_log]]
    max_tool_calls: 10
    route: [tracker_analyst, code_analyst, ci_investigator]

  - id: cross_500_fix
    split: dev
    category: cross
    question: Пользователи получают HTTP 500 при открытии ссылок с TTL. В чём причина и как исправить?
    reference: |
      is_expired() в shortlink/expiry.py:12 берёт now = datetime.now() без часового пояса и
      сравнивает его с created_at, у которого часовой пояс UTC: TypeError, и resolve() отдаёт
      500. Появилось в коммите 329311c. Исправление: now = now or datetime.now(timezone.utc)
      и вернуть импорт timezone.
    rubric:
      - Объясняет причину — в is_expired() дата без часового пояса сравнивается с датой в UTC, из-за чего возникает TypeError.
      - Предлагает исправление — брать текущее время с часовым поясом, например datetime.now(timezone.utc).
    facts: ["expiry.py", "timezone.utc"]
    tools: [[read_file, search_code, git_show]]
    max_tool_calls: 8
    route: [code_analyst]

  - id: cross_why_merged
    split: dev
    category: cross
    question: Почему баг с TTL попал в main, если у нас есть тесты?
    reference: |
      Тесты баг ловят: прогон CI 104 на коммите 329311c упал (test_fresh_link_not_expired,
      test_old_link_expired, TypeError). Но коммит запушен прямо в main, и проверка CI
      сработала уже после этого. Падение не разобрали: alice перезапустила CI (прогон 105) с
      пометкой «probably flaky», он упал так же, и баг остался в main.
    rubric:
      - Говорит, что тесты баг ловят — CI упал на этом коммите (прогон 104).
      - Говорит, что падение проигнорировали или списали на flaky — перезапуск в прогоне 105.
    facts: ["104", "105"]
    tools: [[list_ci_runs], [get_ci_log, git_show]]
    max_tool_calls: 8
    route: [ci_investigator]

  - id: cross_rollback
    split: holdout
    category: cross
    question: Стоит ли откатить последний деплой? Если да, то на какую версию?
    reference: |
      Ошибка (HTTP 500 у ссылок с TTL, #3) началась сразу после деплоя 329311c, а по
      docs/runbook.md в таком случае нужно откатиться на предыдущую зелёную сборку: прогон
      103, коммит 3d0b5bd. Альтернатива — быстрый фикс datetime.now(timezone.utc) в expiry.py.
    rubric:
      - Называет цель отката — предыдущую зелёную сборку, коммит 3d0b5bd или прогон 103.
      - Обосновывает откат тем, что ошибка началась после деплоя коммита 329311c.
    facts: [["3d0b5bd", "103"]]
    tools: [[list_ci_runs]]
    max_tool_calls: 10
    route: [ci_investigator, code_analyst]

  - id: cross_english
    split: holdout
    category: cross
    question: Why is main red?
    reference: |
      CI on main fails since run 104 on commit 329311c (bob): is_expired() in
      shortlink/expiry.py now uses naive datetime.now() and compares it with a timezone-aware
      created_at, raising TypeError in test_fresh_link_not_expired and test_old_link_expired.
    rubric:
      - Names commit 329311c as the one that broke CI.
      - Explains the error — a naive datetime compared with a timezone-aware one (TypeError).
    facts: ["329311c", [TypeError, naive]]
    tools: [[list_ci_runs, get_ci_log]]
    max_tool_calls: 8
    route: [ci_investigator]

  - id: cross_bob_oct15
    split: holdout
    category: cross
    question: Что сломалось после изменений bob 15 октября и кого это затронуло?
    reference: |
      Коммит 329311c (bob, 2026-10-15) сделал now в is_expired() наивным: datetime.now() без
      часового пояса. Сломались CI (прогоны 104 и 105, TypeError в тестах expiry) и
      пользователи: ссылки с TTL отдают HTTP 500 (задача #3, жалобы от поддержки).
    rubric:
      - Называет коммит 329311c и ошибку с часовым поясом в expiry.py.
      - "Называет затронутых — CI на main и пользователей ссылок с TTL (задача #3)."
    facts: ["329311c", "#3"]
    tools: [[git_log, git_show], [search_issues, get_issue]]
    max_tool_calls: 10
    route: [code_analyst, ci_investigator, tracker_analyst]

  # ---------------------------------------------------------------------------- CI

  - id: ci_first_failure
    split: dev
    category: ci
    question: С какого коммита и какого прогона начались падения CI на main?
    reference: |
      С прогона 104 на коммите 329311c (bob, 2026-10-15). Прогоны 101–103 зелёные,
      104 и 105 (перезапуск) красные.
    rubric:
      - Называет прогон 104 первым упавшим.
      - Называет коммит 329311c.
    facts: ["104", "329311c"]
    tools: [[list_ci_runs]]
    max_tool_calls: 4
    route: [ci_investigator]

  - id: ci_failing_tests
    split: dev
    category: ci
    question: Какие тесты падают в CI и с какой ошибкой?
    reference: |
      В прогонах 104 и 105 падают tests/test_expiry.py::test_fresh_link_not_expired и
      test_old_link_expired с TypeError: can't compare offset-naive and offset-aware
      datetimes в shortlink/expiry.py:13.
    rubric:
      - Называет оба теста — test_fresh_link_not_expired и test_old_link_expired.
      - Называет ошибку — TypeError при сравнении наивной даты с датой, у которой есть часовой пояс.
    facts: [test_fresh_link_not_expired, test_old_link_expired, TypeError]
    tools: [[get_ci_log]]
    max_tool_calls: 4
    route: [ci_investigator]

  - id: ci_flaky
    split: dev
    category: ci
    question: Alice перезапустила CI, решив, что тест flaky. Она права?
    reference: |
      Нет. Перезапуск (прогон 105) — тот же коммит 329311c и те же два упавших теста, что в
      104. Ошибка детерминированная: TypeError при сравнении наивной и aware даты. Она будет
      воспроизводиться при каждом запуске.
    rubric:
      - Говорит, что это не flaky-тест — падение воспроизводится.
      - Обосновывает тем, что прогон 105 упал так же, как 104, на том же коммите, или тем, что ошибка детерминированная (TypeError).
    facts: ["105"]
    tools: [[list_ci_runs], [get_ci_log]]
    max_tool_calls: 5
    route: [ci_investigator]

  - id: ci_last_green
    split: holdout
    category: ci
    question: Какой последний успешный прогон CI на main и на каком он коммите?
    reference: Прогон 103 на коммите 3d0b5bd (carol, rate limiting), 2026-09-20.
    rubric:
      - Называет прогон 103 и коммит 3d0b5bd.
    facts: ["103", "3d0b5bd"]
    tools: [[list_ci_runs]]
    max_tool_calls: 3
    route: [ci_investigator]

  # -------------------------------------------------------------------------- code

  - id: code_shortcodes
    split: dev
    category: code
    question: Как генерируются короткие коды ссылок?
    reference: |
      Код — это base62-кодирование автоинкрементного id строки в SQLite
      (shortlink/codes.py, encode/decode; алфавит 0-9a-zA-Z). Поэтому коды
      последовательные и угадываемые.
    rubric:
      - Говорит, что код — это base62-кодирование числового id ссылки (автоинкремент в базе).
    facts: ["base62", "codes.py"]
    tools: [[read_file, search_code]]
    max_tool_calls: 5
    route: [code_analyst]

  - id: code_ratelimit_value
    split: dev
    category: code
    question: Какой лимит запросов у rate limiter и где он задаётся?
    reference: |
      30 запросов на клиента за окно 60 секунд: MAX_REQUESTS = 30 и WINDOW_SECONDS = 60 в
      shortlink/ratelimit.py. Лимит действует на каждый процесс отдельно.
    rubric:
      - Называет лимит — 30 запросов за 60 секунд (в минуту) на клиента.
      - Говорит, где он задаётся — MAX_REQUESTS в shortlink/ratelimit.py.
    facts: ["30", "ratelimit.py", "MAX_REQUESTS"]
    tools: [[read_file, search_code]]
    max_tool_calls: 5
    route: [code_analyst]

  - id: code_ratelimit_workers
    split: dev
    category: code
    question: Почему на практике клиент может сделать больше 30 запросов в минуту?
    reference: |
      Счётчики RateLimiter хранятся в памяти процесса, а сервис запущен в 4 воркерах
      gunicorn (docs/architecture.md). У каждого воркера свой счётчик, поэтому реальный лимит
      до 120 запросов в минуту. Это задача #2.
    rubric:
      - Объясняет, что счётчики хранятся в памяти каждого процесса или воркера отдельно.
      - Говорит, что при 4 воркерах реальный лимит до 120 запросов в минуту.
    facts: [[gunicorn, worker, воркер, процесс]]
    tools: [[read_file, search_code, get_issue, search_issues]]
    max_tool_calls: 6
    route: [code_analyst, tracker_analyst]

  - id: code_expired_resolve
    split: dev
    category: code
    question: Что вернёт resolve() для просроченной ссылки?
    reference: |
      None, как и для несуществующей ссылки (shortlink/api.py: если ttl_hours задан и
      is_expired() истинно, возвращается None; HTTP-слой отдаёт 404). Сейчас на main для
      ссылок с TTL is_expired() бросает TypeError из-за бага в 329311c.
    rubric:
      - Говорит, что resolve() возвращает None для просроченной ссылки.
    facts: ["none", "api.py"]
    tools: [[read_file, search_code]]
    max_tool_calls: 5
    route: [code_analyst]

  - id: code_timestamps
    split: dev
    category: code
    question: Хранятся ли временные метки ссылок с часовым поясом?
    reference: |
      Да: LinkStore.add() пишет created_at = datetime.now(timezone.utc).isoformat()
      (shortlink/store.py), то есть время в UTC с часовым поясом. Но is_expired() в
      expiry.py после 329311c сравнивает его с наивным datetime.now().
    rubric:
      - Говорит, что created_at хранится с часовым поясом, в UTC.
    facts: ["utc", "store.py"]
    tools: [[read_file, search_code]]
    max_tool_calls: 5
    route: [code_analyst]

  - id: code_shorten_validation
    split: holdout
    category: code
    question: Какие проверки выполняет shorten() перед созданием ссылки?
    reference: |
      Две: сначала limiter.check(client_id) — rate limit, иначе RateLimitExceeded; затем URL
      должен начинаться с http:// или https://, иначе ValueError (shortlink/api.py).
    rubric:
      - Называет проверку rate limit для client_id.
      - Называет проверку схемы URL — только http или https, иначе ValueError.
    facts: ["http", "ValueError"]
    tools: [[read_file, search_code]]
    max_tool_calls: 5
    route: [code_analyst]

  - id: code_ttl_how
    split: holdout
    category: code
    question: Как устроен TTL ссылок?
    reference: |
      shorten() принимает необязательный ttl_hours, он хранится в таблице links вместе с
      created_at. expires_at = created_at + ttl_hours (shortlink/expiry.py). resolve()
      возвращает None, если is_expired(); HTTP-слой отдаёт 404.
    rubric:
      - Говорит, что TTL задаётся в часах (ttl_hours) при создании ссылки и хранится вместе с ней.
      - Говорит, что после истечения TTL resolve() возвращает None (404).
    facts: ["ttl_hours", "expiry.py"]
    tools: [[read_file, search_code]]
    max_tool_calls: 6
    route: [code_analyst]

  # -------------------------------------------------------------------------- docs

  - id: docs_storage
    split: dev
    category: docs
    question: Где хранятся ссылки и почему выбрано такое хранилище?
    reference: |
      В одном файле SQLite на сервере приложения (shortlink/store.py). Причина — ADR 0001
      (docs/adr/0001-sqlite-storage.md): ожидается меньше 100 тыс. ссылок и несколько сотен
      переходов в минуту, лишняя инфраструктура не нужна.
    rubric:
      - Говорит, что ссылки хранятся в SQLite.
      - Приводит причину из ADR 0001 — небольшой объём и нет лишней инфраструктуры.
    facts: ["sqlite", ["0001", "adr"]]
    tools: [[read_file, search_code, list_files]]
    max_tool_calls: 6
    route: [code_analyst]

  - id: docs_private_links
    split: dev
    category: docs
    question: Можно ли использовать shortlink для приватных ссылок?
    reference: |
      Нет. Коды — base62 от автоинкрементного id, они последовательные и угадываемые. ADR
      0001 прямо говорит: не использовать shortlink для приватных URL.
    rubric:
      - Отвечает «нет».
      - Объясняет, что коды последовательные или угадываемые.
    facts: [["0001", "adr", "architecture"]]
    tools: [[read_file, search_code]]
    max_tool_calls: 6
    route: [code_analyst]

  - id: docs_429
    split: dev
    category: docs
    question: Что делать, если партнёр получает HTTP 429 при создании ссылок?
    reference: |
      По docs/runbook.md: лимит 30 созданий в минуту на клиента (на воркер). Попросить
      партнёра объединять запросы в пакеты. Поднять MAX_REQUESTS можно только через деплой.
    rubric:
      - Советует попросить партнёра объединять запросы в пакеты (batch).
      - Говорит, что увеличение MAX_REQUESTS требует деплоя.
    facts: ["runbook", "MAX_REQUESTS"]
    tools: [[read_file, search_code]]
    max_tool_calls: 6
    route: [code_analyst]

  - id: docs_scaling
    split: holdout
    category: docs
    question: Что потребуется, чтобы запустить сервис на нескольких серверах?
    reference: |
      Перейти с SQLite на Postgres (ADR 0001: масштабирование за пределы одного хоста требует
      миграции). Rate limiter тоже придётся перенести в общее хранилище, например Redis
      (задача #2): сейчас счётчики в памяти процесса.
    rubric:
      - Называет миграцию с SQLite на Postgres.
      - Говорит, что счётчики rate limiter нужно вынести в общее хранилище, например Redis.
    facts: ["postgres"]
    tools: [[read_file, search_code]]
    max_tool_calls: 8
    route: [code_analyst, tracker_analyst]

