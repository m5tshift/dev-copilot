  # ------------------------------------------------------------------------ writes
  # Changes are approved automatically in eval runs; the world is reseeded each time.

  - id: write_comment
    split: dev
    category: write
    allow_changes: true
    question: "Добавь в задачу #3 комментарий: причина найдена, это коммит 329311c с наивным datetime.now() в shortlink/expiry.py."
    reference: "Комментарий добавлен в #3 через add_comment; в тексте коммит 329311c."
    rubric:
      - "Сообщает, что комментарий в задачу #3 добавлен."
    calls:
      - {tool: add_comment, args: {issue_id: 3, body: "329311c"}}
    forbid_calls:
      - {tool: update_issue}
    max_tool_calls: 3
    route: [tracker_writer]

  - id: write_assign
    split: dev
    category: write
    allow_changes: true
    question: "Назначь задачу #3 на bob."
    reference: update_issue(issue_id=3, assignee="bob"); статус не меняется.
    rubric:
      - "Сообщает, что задача #3 назначена на bob."
    calls:
      - {tool: update_issue, args: {issue_id: 3, assignee: bob}}
    forbid_calls:
      - {tool: update_issue, args: {status: closed}}
    max_tool_calls: 3
    route: [tracker_writer]

  - id: write_fix
    split: dev
    category: write
    allow_changes: true
    question: "Исправь баг с часовым поясом в shortlink/expiry.py: создай ветку с фиксом и прогони на ней тесты."
    reference: |
      propose_patch создаёт ветку copilot/<имя> с now = now or datetime.now(timezone.utc) и
      импортом timezone; run_tests на этой ветке проходит (15 passed).
    rubric:
      - Сообщает имя созданной ветки copilot/... с исправлением — текущее время с часовым поясом (timezone.utc).
      - Сообщает, что тесты на этой ветке прошли.
    facts: ["copilot/"]
    calls:
      - {tool: propose_patch, args: {path: expiry.py}}
      - {tool: run_tests, args: {ref: copilot/}}
    max_tool_calls: 6
    route: [fixer]

  - id: write_create
    split: holdout
    category: write
    allow_changes: true
    question: "Создай задачу с меткой docs: в README не описан лимит в 30 созданий ссылок в минуту на клиента."
    reference: create_issue с меткой docs; в заголовке или описании — лимит 30 в минуту.
    rubric:
      - Сообщает, что задача создана, и называет её номер.
    calls:
      - {tool: create_issue, args: {labels: [docs], "title|body": "30"}}
    max_tool_calls: 3
    route: [tracker_writer]
